<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg Fix Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🔧 FFmpeg.wasm Fix Test</h1>
    <p>Testing the fixes for variable redeclaration and FFmpeg loading issues.</p>
    
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }
        
        async function testFFmpegWorker() {
            addResult('🧪 Testing FFmpeg worker initialization...');
            
            try {
                const worker = new Worker('./ffmpeg-worker.js');
                
                worker.onmessage = function(e) {
                    if (e.data.type === 'TEST_RESPONSE') {
                        addResult('✅ FFmpeg worker loaded without syntax errors', 'success');
                        worker.terminate();
                        testFFmpegLoading();
                    }
                };
                
                worker.onerror = function(error) {
                    addResult('❌ FFmpeg worker failed: ' + error.message, 'error');
                    worker.terminate();
                };
                
                // Test basic worker functionality
                worker.postMessage({ type: 'TEST' });
                
                // Timeout fallback
                setTimeout(() => {
                    addResult('⏰ Worker test timeout - may indicate loading issues', 'error');
                    worker.terminate();
                }, 5000);
                
            } catch (error) {
                addResult('❌ Failed to create worker: ' + error.message, 'error');
            }
        }
        
        function testFFmpegLoading() {
            addResult('🧪 Testing FFmpeg.wasm loading strategies...');
            
            const worker = new Worker('./ffmpeg-worker.js');
            
            worker.onmessage = function(e) {
                if (e.data.type === 'FFMPEG_TEST_RESULT') {
                    if (e.data.message.includes('successfully')) {
                        addResult('✅ ' + e.data.message, 'success');
                    } else {
                        addResult('⚠️ ' + e.data.message, 'info');
                    }
                    worker.terminate();
                }
            };
            
            worker.onerror = function(error) {
                addResult('❌ FFmpeg loading test failed: ' + error.message, 'error');
                worker.terminate();
            };
            
            worker.postMessage({ type: 'TEST_FFMPEG' });
        }
        
        // Start tests
        addResult('🚀 Starting FFmpeg fix verification tests...');
        testFFmpegWorker();
    </script>
</body>
</html>
</html>
