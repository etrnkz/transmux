<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transmux — WASM Video Player</title>

    <!-- The player's own look. Scoped under .wvp-root, so it cannot leak into
         this page or inherit anything from it. -->
    <link rel="stylesheet" href="./wasm-video-player.css">

    <!-- Host page chrome only. Everything inside the player comes from the
         library; this block just frames it on the page. -->
    <style>
        :root { color-scheme: dark; }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #07080d;
            color: #ededed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #app {
            width: 100%;
            max-width: 1120px;
        }

        .boot-error {
            max-width: 60ch;
            margin: 64px auto;
            padding: 16px 20px;
            border: 1px solid rgba(229, 72, 77, 0.3);
            border-radius: 8px;
            background: rgba(229, 72, 77, 0.08);
            font-size: 14px;
            line-height: 22px;
        }

        noscript {
            display: block;
            margin: 64px auto;
            max-width: 60ch;
            font-size: 14px;
            color: #a1a1a6;
        }
    </style>
</head>
<body>
    <main id="app"></main>

    <noscript>This player is a WebAssembly application and needs JavaScript enabled.</noscript>

    <script type="module">
        import { createPlayer } from './wasm-video-player.js';

        /*
         * The standalone app is a host page, not a second implementation. It
         * mounts the same player the package exports, so there is exactly one
         * copy of the playback logic in this repository.
         *
         * Everything below is host glue: stable element ids, and a couple of
         * global functions. Nothing here touches MediaSource, the worker, or
         * the conversion pipeline.
         */

        const app = document.getElementById('app');

        let player;
        try {
            player = createPlayer({
                container: app,
                workerUrl: './ffmpeg-worker.js',
                coreBaseUrl: './public',
                fileInputId: 'fileInput'
            });
        } catch (err) {
            app.innerHTML = '';
            const box = document.createElement('div');
            box.className = 'boot-error';
            box.textContent = 'The player failed to start: ' + (err && err.message ? err.message : err);
            app.appendChild(box);
            throw err;
        }

        // The library generates its own DOM with collision-proof ids. This page
        // is the only host in the repo, so it re-labels the parts it needs with
        // the plain ids the e2e suites and the console use.
        const { ui } = player;
        ui.video.id = 'videoPlayer';
        ui.upload.id = 'uploadArea';
        ui.videoContainer.id = 'videoContainer';
        ui.status.id = 'status';
        ui.progress.id = 'progressContainer';
        ui.progressText.id = 'progressText';
        ui.progressPct.id = 'progressPct';
        ui.progressFill.id = 'progressFill';
        ui.subtitleBtn.id = 'subtitleBtn';
        ui.rateSelect.id = 'rateSelect';
        ui.audioSelect.id = 'audioTrackSelect';
        if (ui.exportBtn) ui.exportBtn.id = 'exportBtn';
        if (ui.resetBtn) ui.resetBtn.id = 'resetBtn';
        if (ui.ffmpegPillText) ui.ffmpegPillText.id = 'ffmpegStatusText';
        if (ui.ffmpegPill) ui.ffmpegPill.id = 'ffmpegStatus';
        if (ui.logEntries) ui.logEntries.id = 'logEntries';
        if (ui.clearLogBtn) ui.clearLogBtn.id = 'clearLogBtn';

        // The markup used to call these by name from inline handlers. Keeping
        // them as globals means the browser console (and the e2e suites) can
        // still drive the player without digging into the instance.
        window.player = player;
        window.resetPlayer = () => player.reset();
        window.downloadProcessed = () => player.exportVideo();
        window.setPlaybackRate = (value) => player.setPlaybackRate(value);
        window.selectAudioTrack = (value) => player.selectAudioTrack(value);
        window.toggleSubtitles = () => player.toggleSubtitles();
        window.clearLog = () => player.clearLog();
    </script>
</body>
</html>
