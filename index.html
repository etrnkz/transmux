<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM Video Player</title>
    <style>
        :root {
            /* Ink neutral ramp from Unslop tokens */
            --bg-base: #07080d;
            --bg-page: #0b0d14;
            --bg-surface: #11141c;
            --bg-raised: #181c26;
            --bg-active: #212634;
            --border-hairline: rgba(255, 255, 255, 0.08);
            --border-subtle: rgba(255, 255, 255, 0.12);
            --text-primary: #ededed;
            --text-secondary: #a1a1a6;
            --text-muted: #85858b;

            /* Accent & status colors (restrained, 4.5:1 accessible) */
            --accent: #38bdf8;
            --accent-bg: rgba(56, 189, 248, 0.10);
            --accent-border: rgba(56, 189, 248, 0.24);
            --positive: #4cc38a;
            --positive-bg: rgba(76, 195, 138, 0.10);
            --positive-border: rgba(76, 195, 138, 0.22);
            --warning: #f59e0b;
            --negative: #e5484d;
            --negative-bg: rgba(229, 72, 77, 0.10);
            --negative-border: rgba(229, 72, 77, 0.22);

            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 24px;
            -webkit-font-smoothing: antialiased;
        }

        .studio-shell {
            width: 100%;
            max-width: 1120px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* App Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-hairline);
        }

        .header-title-group {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        h1 {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Status & Telemetry Pill */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            background: var(--bg-raised);
            border: 1px solid var(--border-hairline);
            font-size: 12px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            color: var(--text-secondary);
            transition: all 160ms var(--ease-out);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background 160ms var(--ease-out);
        }

        .status-pill.success .status-dot { background: var(--positive); }
        .status-pill.info .status-dot { background: var(--accent); }
        .status-pill.error .status-dot { background: var(--negative); }

        /* Hidden proxy container for test script selectors */
        #ffmpegStatus { display: inline-flex; }

        /* Notification Banner (Integrated Alert Strip) */
        .status-bar {
            display: none;
            padding: 10px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            line-height: 18px;
            transition: all 160ms var(--ease-out);
        }

        .status-bar.info {
            display: block;
            background: var(--accent-bg);
            border: 1px solid var(--accent-border);
            color: #bae6fd;
        }

        .status-bar.success {
            display: block;
            background: var(--positive-bg);
            border: 1px solid var(--positive-border);
            color: #a7f3d0;
        }

        .status-bar.error {
            display: block;
            background: var(--negative-bg);
            border: 1px solid var(--negative-border);
            color: #fecaca;
        }

        /* Monitor / Viewport Stage */
        .viewport-stage {
            position: relative;
            background: var(--bg-surface);
            border: 1px solid var(--border-hairline);
            border-radius: var(--radius-xl);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 480px;
        }

        /* Empty State & Upload Area */
        .upload-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 64px 32px;
            cursor: pointer;
            text-align: center;
            transition: background 150ms var(--ease-out), border-color 150ms var(--ease-out);
        }

        .upload-area:hover, .upload-area.dragover {
            background: var(--bg-raised);
        }

        .upload-icon-box {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            background: var(--bg-raised);
            border: 1px solid var(--border-hairline);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .upload-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .upload-sub {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--text-primary);
            color: var(--bg-base);
            padding: 8px 18px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: opacity 120ms var(--ease-out), transform 120ms var(--ease-out);
        }

        .upload-btn:hover {
            opacity: 0.92;
        }

        .upload-btn:active {
            transform: scale(0.98);
        }

        .file-input { display: none; }

        .format-pills {
            display: flex;
            gap: 6px;
            margin-top: 24px;
        }

        .format-pill {
            font-size: 11px;
            font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
            padding: 2px 8px;
            background: var(--bg-raised);
            border: 1px solid var(--border-hairline);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
        }

        /* Active Video Container */
        .video-container {
            display: none;
            width: 100%;
            background: #000;
            position: relative;
        }

        video {
            display: block;
            width: 100%;
            max-height: 600px;
            background: #000;
        }

        /* Progress Bar */
        .progress-container {
            display: none;
            padding: 12px 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-hairline);
            border-radius: var(--radius-md);
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--bg-raised);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 200ms var(--ease-out);
        }

        /* Action Controls Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-hairline);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
            /* Wraps instead of overflowing once the optional controls appear */
            flex-wrap: wrap;
            row-gap: 8px;
        }

        /* Narrow screens cannot fit the subtitle/audio/rate/export row, so stack
           the toolbar instead of letting the two groups squeeze each other into
           uneven, vertically-centred rows. */
        @media (max-width: 600px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .controls-group {
                justify-content: flex-start;
            }

            .track-select,
            .rate-select {
                max-width: 100%;
            }
        }

        .control-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1px solid var(--border-hairline);
            background: var(--bg-raised);
            color: var(--text-secondary);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: background 120ms var(--ease-out), color 120ms var(--ease-out), border-color 120ms var(--ease-out);
        }

        .control-btn:hover {
            background: var(--bg-active);
            color: var(--text-primary);
            border-color: var(--border-subtle);
        }

        .control-btn:active {
            transform: scale(0.98);
        }

        .control-btn svg {
            color: var(--text-muted);
        }

        /* Audio track picker — only shown when a file has more than one track */
        .track-select {
            display: none;
            align-items: center;
            padding: 6px 10px;
            border: 1px solid var(--border-hairline);
            background: var(--bg-raised);
            color: var(--text-secondary);
            border-radius: var(--radius-md);
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            max-width: 220px;
            transition: background 120ms var(--ease-out), color 120ms var(--ease-out), border-color 120ms var(--ease-out);
        }

        .track-select:hover {
            background: var(--bg-active);
            color: var(--text-primary);
            border-color: var(--border-subtle);
        }

        .track-select:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Playback rate — deliberately narrow, it holds short values only */
        .rate-select {
            display: inline-flex;
            align-items: center;
            padding: 6px 8px;
            border: 1px solid var(--border-hairline);
            background: var(--bg-raised);
            color: var(--text-secondary);
            border-radius: var(--radius-md);
            font-size: 12px;
            font-weight: 500;
            font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
            cursor: pointer;
            transition: background 120ms var(--ease-out), color 120ms var(--ease-out), border-color 120ms var(--ease-out);
        }

        .rate-select:hover {
            background: var(--bg-active);
            color: var(--text-primary);
            border-color: var(--border-subtle);
        }

        .rate-select:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Inspector / Telemetry Drawer */
        .log-section {
            background: var(--bg-surface);
            border: 1px solid var(--border-hairline);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-hairline);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .log-panel {
            padding: 12px 16px;
            max-height: 160px;
            overflow-y: auto;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 11px;
            line-height: 18px;
            color: var(--text-muted);
            background: var(--bg-base);
        }

        .log-entry {
            display: flex;
            gap: 8px;
            padding: 1px 0;
        }

        .log-entry .log-time {
            color: rgba(255, 255, 255, 0.28);
            user-select: none;
            flex-shrink: 0;
        }

        .log-entry.log-success { color: #86efac; }
        .log-entry.log-error { color: #fca5a5; }
        .log-entry.log-warn { color: #fde047; }
        .log-entry.log-info { color: var(--text-secondary); }

        /* Keyboard focus: visible ring on every interactive surface */
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: var(--radius-sm);
        }

        .upload-area:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -3px;
            border-radius: var(--radius-xl);
            background: var(--bg-raised);
        }

        .control-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .control-btn:disabled:hover {
            background: var(--bg-raised);
            color: var(--text-secondary);
            border-color: var(--border-hairline);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .control-btn:active { transform: none; }
        }
    </style>
</head>
<body>
    <div class="studio-shell">
        <!-- Studio Header -->
        <header class="app-header">
            <div class="header-title-group">
                <h1>WASM Video Player</h1>
                <span class="subtitle">Real-time WebAssembly demuxing & live playback</span>
            </div>
            <div id="ffmpegStatus" class="status-pill">
                <span class="status-dot"></span>
                <span id="ffmpegStatusText">Initializing FFmpeg.wasm...</span>
            </div>
        </header>

        <!-- Status Notification Banner -->
        <div class="status-bar" id="status" role="status" aria-live="polite"></div>

        <!-- Video Viewport Stage -->
        <div class="viewport-stage">
            <!-- Drop & Upload State -->
            <div class="upload-area" id="uploadArea" role="button" tabindex="0" aria-label="Drop a video file here, or press Enter to choose a file">
                <div class="upload-icon-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </div>
                <div class="upload-title">Drop video file to play</div>
                <div class="upload-sub">Immediate live streaming for AVI, MKV, MP4, WebM, MOV</div>
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                    <span>Choose file</span>
                </button>
                <input type="file" id="fileInput" class="file-input" accept="video/*">

                <div class="format-pills">
                    <span class="format-pill">AVI</span>
                    <span class="format-pill">MKV</span>
                    <span class="format-pill">MP4</span>
                    <span class="format-pill">MOV</span>
                    <span class="format-pill">WEBM</span>
                </div>
            </div>

            <!-- Video Player -->
            <div class="video-container" id="videoContainer">
                <video id="videoPlayer" controls playsinline></video>
                <div class="toolbar">
                    <div class="controls-group">
                        <button class="control-btn" id="subtitleBtn" onclick="toggleSubtitles()" disabled title="Load a video to check for subtitles">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="4" width="20" height="16" rx="2"/>
                                <path d="M7 15h3"/><path d="M14 15h3"/><path d="M7 11h10"/>
                            </svg>
                            <span>Subtitles</span>
                        </button>
                        <select class="track-select" id="audioTrackSelect" aria-label="Audio track" onchange="selectAudioTrack(this.value)"></select>
                        <select class="rate-select" id="rateSelect" aria-label="Playback speed" onchange="setPlaybackRate(this.value)" disabled title="Load a video to change playback speed">
                            <option value="0.5">0.5×</option>
                            <option value="0.75">0.75×</option>
                            <option value="1" selected>1×</option>
                            <option value="1.25">1.25×</option>
                            <option value="1.5">1.5×</option>
                            <option value="2">2×</option>
                        </select>
                        <button class="control-btn" onclick="downloadProcessed()">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            <span>Export MP4</span>
                        </button>
                    </div>
                    <div class="controls-group">
                        <button class="control-btn" onclick="resetPlayer()">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                                <path d="M3 3v5h5"/>
                            </svg>
                            <span>Reset</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Conversion & Stream Buffer Progress -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-meta">
                <span id="progressText">Processing...</span>
                <span id="progressPct">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Telemetry & Conversion Inspector -->
        <div class="log-section">
            <div class="log-header">
                <span>FFmpeg Telemetry</span>
                <button class="control-btn" onclick="clearLog()" style="padding: 2px 8px; font-size: 11px;">Clear</button>
            </div>
            <div class="log-panel" id="logPanel" role="log" aria-live="polite" aria-label="FFmpeg telemetry output">
                <div id="logEntries">
                    <div class="log-entry"><span class="log-time">[--:--:--]</span><span>Awaiting FFmpeg output...</span></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import init, { VideoProcessor } from './pkg/wasm_video_player.js';

        let videoProcessor;
        let worker = null;
        let currentVideoUrl = null;
        let convertedVideoUrl = null;
        let currentPreviewUrl = null;
        let isPlayingPreview = false;
        let currentFile = null;

        let activeMediaSource = null;
        let activeMediaSourceUrl = null;
        let activeSourceBuffer = null;
        let chunkQueue = [];
        let isAppendingChunk = false;
        let isExporting = false;
        let pendingExportUrl = null;
        let subtitleTrackUrl = null;
        // True when convertedVideoUrl is a remuxed, complete MP4 blob we can
        // hand straight to the downloader without re-encoding.
        let isFastCopyExport = false;

        // Audio tracks reported by the worker for the current file, and the one
        // the user picked. -1 means "this file has no audio".
        let audioTracks = [];
        let selectedAudioTrack = 0;

        // True while a conversion/export/stream is actually running in the
        // worker. Only then is it worth paying the ~1.5s core reload to
        // interrupt it — ffmpeg-core cannot abort a running exec, so the only
        // real interruption is terminating the worker.
        let workerBusy = false;

        function spawnWorker() {
            const w = new Worker('./ffmpeg-worker.js');
            attachWorkerHandlers(w);
            worker = w;
            return w;
        }

        function attachWorkerHandlers(w) {
            w.onmessage = handleWorkerMessage;
            w.onerror = (err) => appendLog(`Worker error: ${err.message || err}`, 'error');
        }

        // Terminate the worker mid-exec and start a fresh one. The token bump is
        // implicit (a new worker starts with a clean queue), so nothing from the
        // abandoned job can post a result into the new session.
        function interruptWorker() {
            const stale = worker;
            workerBusy = false;
            worker = null;
            try { if (stale) stale.terminate(); } catch (_) {}
            spawnWorker();
            appendLog('Restarted FFmpeg worker to interrupt the running job', 'info');
        }

        function cleanupMediaSource() {
            if (activeMediaSource && activeMediaSource.readyState === 'open') {
                try { activeMediaSource.endOfStream(); } catch (_) {}
            }
            if (activeMediaSourceUrl) {
                try { URL.revokeObjectURL(activeMediaSourceUrl); } catch (_) {}
                activeMediaSourceUrl = null;
            }
            activeMediaSource = null;
            activeSourceBuffer = null;
            chunkQueue = [];
            isAppendingChunk = false;
        }

        function processNextChunk() {
            if (!activeSourceBuffer || isAppendingChunk || activeSourceBuffer.updating || chunkQueue.length === 0) {
                return;
            }
            isAppendingChunk = true;
            const next = chunkQueue.shift();
            try {
                activeSourceBuffer.appendBuffer(next);
            } catch (err) {
                isAppendingChunk = false;
                appendLog('Stream buffer append error: ' + err.message, 'warn');
            }
        }

        function appendLog(message, level = 'info') {
            const el = document.getElementById('logEntries');
            if (el.children.length === 1 && el.children[0].textContent.includes('Awaiting FFmpeg output...')) {
                el.innerHTML = '';
            }
            const div = document.createElement('div');
            div.className = `log-entry log-${level}`;
            const time = new Date().toLocaleTimeString();
            div.innerHTML = `<span class="log-time">[${time}]</span><span>${escapeHtml(message)}</span>`;
            el.appendChild(div);
            el.scrollTop = el.scrollHeight;
            while (el.children.length > 300) el.removeChild(el.firstChild);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function clearLog() {
            document.getElementById('logEntries').innerHTML = '<div class="log-entry"><span class="log-time">[--:--:--]</span><span>Awaiting FFmpeg output...</span></div>';
        }

        function showStatus(msg, type = 'info') {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = `status-bar ${type}`;
        }

        function showProgress() {
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressText').textContent = 'Starting...';
            const pct = document.getElementById('progressPct');
            if (pct) pct.textContent = '0%';
        }

        function hideProgress() {
            document.getElementById('progressContainer').style.display = 'none';
        }

        function updateProgress(data) {
            const p = Math.round(data.progress || 0);
            document.getElementById('progressFill').style.width = p + '%';
            document.getElementById('progressText').textContent = (data.status || 'Processing...');
            const pct = document.getElementById('progressPct');
            if (pct) pct.textContent = p + '%';
            if (p >= 100) setTimeout(hideProgress, 1500);
        }

        function showVideoContainer() {
            document.getElementById('uploadArea').style.display = 'none';
            document.getElementById('videoContainer').style.display = 'block';
        }

        async function initializeApp() {
            try {
                if (typeof SharedArrayBuffer === 'undefined') {
                    appendLog('SharedArrayBuffer not available — single-threaded mode active', 'warn');
                }

                await init();
                videoProcessor = new VideoProcessor();
                videoProcessor.initialize('videoPlayer');
                videoProcessor.set_progress_callback((progress) => updateProgress(progress));

                setTimeout(() => {
                    try {
                        // The Rust layer owns the first worker. Keep it: spawning
                        // our own would load the 23 MB core a second time.
                        const rustWorker = videoProcessor.get_worker();
                        if (rustWorker) {
                            worker = rustWorker;
                            attachWorkerHandlers(worker);
                            appendLog('Worker message handlers set up', 'success');
                        } else {
                            throw new Error('no worker handle');
                        }
                    } catch (e) {
                        // No Rust worker available — own it in JS from the start,
                        // which is also the path used after an interrupt.
                        appendLog('Falling back to a JS-managed worker: ' + e.message, 'warn');
                        spawnWorker();
                    }
                }, 200);

                // Initialize UI in calm state without loud banner
                setupEventListeners();
                appendLog('Application initialized successfully', 'success');

            } catch (err) {
                showStatus('Failed to initialize: ' + err.message, 'error');
                appendLog('Init failed: ' + err.message, 'error');
            }
        }

        function handleWorkerMessage(event) {
            const msg = event.data;
            if (!msg || !msg.type) return;
            const data = msg.data || {};

            switch (msg.type) {
                case 'FFLOG':
                    appendLog(data.message || '', 'info');
                    break;
                case 'LOG':
                    appendLog(data.message || '', data.level || 'info');
                    break;
                case 'WORKER_READY':
                    appendLog('FFmpeg worker ready', 'success');
                    document.getElementById('ffmpegStatusText').textContent = 'FFmpeg.wasm loaded — full conversion available';
                    document.getElementById('ffmpegStatus').className = 'status-pill success';
                    break;
                case 'PROGRESS':
                    workerBusy = true;
                    updateProgress(data);
                    break;
                case 'AUDIO_TRACKS':
                    setAudioTracks(data.tracks || [], data.selected);
                    break;
                case 'STREAM_START':
                    workerBusy = true;
                    cleanupMediaSource();
                    showVideoContainer();

                    const streamVideo = document.getElementById('videoPlayer');
                    activeMediaSource = new MediaSource();
                    activeMediaSourceUrl = URL.createObjectURL(activeMediaSource);
                    streamVideo.src = activeMediaSourceUrl;

                    activeMediaSource.onsourceopen = () => {
                        try {
                            const mime = data.mime || 'video/mp4; codecs="avc1.42E01E, mp4a.40.2"';
                            activeSourceBuffer = activeMediaSource.addSourceBuffer(mime);
                            activeSourceBuffer.mode = 'sequence';

                            activeSourceBuffer.onupdateend = () => {
                                isAppendingChunk = false;
                                if (streamVideo.paused && streamVideo.currentTime === 0) {
                                    streamVideo.play().catch(() => {});
                                }
                                processNextChunk();
                            };

                            processNextChunk();
                        } catch (e) {
                            appendLog('MediaSource init error: ' + e.message, 'error');
                        }
                    };

                    showStatus('Live streaming started — playing video as it converts', 'info');
                    appendLog(`Live stream initialized (${(data.duration || 0).toFixed(1)}s total)`, 'info');
                    break;

                case 'STREAM_CHUNK':
                    if (data.chunk) {
                        chunkQueue.push(data.chunk);
                        processNextChunk();

                        const video = document.getElementById('videoPlayer');
                        if (data.index === 0) {
                            showStatus('Live stream playing — buffering remaining video in background', 'success');
                            appendLog('First stream segment buffered — playback started', 'success');
                            video.play().catch(() => {});
                        }
                    }
                    break;

                case 'STREAM_END':
                    workerBusy = false;
                    showStatus(data.note || 'Entire video converted and ready', 'success');
                    appendLog(data.note || 'Successfully converted video and buffered all streams', 'success');

                    // The buffered chunks are a valid MSE timeline but not a valid
                    // single MP4 file, so export re-encodes from the source instead.
                    {
                        // Bind the interval to *this* MediaSource so a reset or a
                        // newer stream cannot have its buffer closed by a stale timer.
                        const ms = activeMediaSource;
                        const waitAppend = setInterval(() => {
                            if (activeMediaSource !== ms) { clearInterval(waitAppend); return; }
                            if (chunkQueue.length === 0 && (!activeSourceBuffer || !activeSourceBuffer.updating)) {
                                clearInterval(waitAppend);
                                try { ms.endOfStream(); } catch (_) {}
                            }
                        }, 100);
                        setTimeout(() => clearInterval(waitAppend), 60000);
                    }
                    break;

                case 'VIDEO_READY':
                    workerBusy = false;
                    if (data.url) {
                        const video = document.getElementById('videoPlayer');
                        showVideoContainer();

                        if (data.isPreview) {
                            isPlayingPreview = true;
                            currentPreviewUrl = data.url;
                            showStatus(data.note || 'Streaming preview ready', 'info');
                            appendLog(data.note || 'Streaming preview ready', 'success');

                            video.src = data.url;
                            video.load();
                            video.play().catch(() => {});
                        } else {
                            // A remuxed MP4 blob is a complete file, so export can reuse it directly.
                            convertedVideoUrl = data.url;
                            isFastCopyExport = true;
                            showStatus(data.note || 'Successfully converted', 'success');
                            appendLog(data.note || 'Successfully converted video', 'success');

                            if (isPlayingPreview) {
                                const savedTime = video.currentTime || 0;
                                const wasPaused = video.paused;
                                isPlayingPreview = false;

                                video.src = data.url;
                                video.addEventListener('loadedmetadata', function onMeta() {
                                    video.removeEventListener('loadedmetadata', onMeta);
                                    try {
                                        if (savedTime > 0 && savedTime < video.duration) {
                                            video.currentTime = savedTime;
                                        }
                                    } catch (e) {}
                                    if (!wasPaused) {
                                        video.play().catch(() => {});
                                    }
                                }, { once: true });

                                appendLog(`Seamlessly transitioned to full video at ${savedTime.toFixed(1)}s`, 'success');

                                if (currentPreviewUrl) {
                                    setTimeout(() => {
                                        try { URL.revokeObjectURL(currentPreviewUrl); } catch (e) {}
                                        currentPreviewUrl = null;
                                    }, 2000);
                                }
                            } else {
                                video.src = data.url;
                                video.load();
                                video.play().catch(() => {});
                            }
                        }
                    }
                    break;

                case 'SUBTITLES_READY':
                    loadSubtitles(data.subtitles);
                    break;
                case 'EXPORT_STATUS':
                    isExporting = true;
                    workerBusy = true;
                    showProgress();
                    if (typeof data.progress === 'number') {
                        updateProgress({ progress: data.progress, status: data.message });
                    } else {
                        document.getElementById('progressText').textContent = data.message || 'Exporting...';
                        document.getElementById('progressFill').style.width = '0%';
                        document.getElementById('progressPct').textContent = '0%';
                    }
                    appendLog(data.message || 'Exporting...', 'info');
                    break;
                case 'EXPORT_READY':
                    isExporting = false;
                    workerBusy = false;
                    hideProgress();
                    if (pendingExportUrl) { try { URL.revokeObjectURL(pendingExportUrl); } catch (_) {} }
                    pendingExportUrl = data.url;
                    showStatus(data.note || 'MP4 export ready', 'success');
                    appendLog(data.note || 'MP4 export ready', 'success');
                    triggerDownload(data.url);
                    break;
                case 'ERROR':
                    isExporting = false;
                    workerBusy = false;
                    showStatus(data.message || 'Processing error', 'error');
                    appendLog('Error: ' + (data.message || 'Unknown'), 'error');
                    hideProgress();
                    break;
                case 'TEST_RESPONSE':
                    appendLog('Worker test: ' + (data.message || 'OK'), 'success');
                    break;
                default:
                    appendLog(`Unknown message: ${msg.type}`, 'warn');
            }
        }

        function setupEventListeners() {
            const area = document.getElementById('uploadArea');
            const input = document.getElementById('fileInput');

            area.addEventListener('dragover', (e) => { e.preventDefault(); area.classList.add('dragover'); });
            area.addEventListener('dragleave', () => area.classList.remove('dragover'));
            area.addEventListener('drop', (e) => { e.preventDefault(); area.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
            input.addEventListener('change', (e) => handleFiles(e.target.files));

            // The whole dropzone is a button: click or Enter/Space opens the picker.
            // The inner "Choose file" button is excluded so it does not double-fire.
            area.addEventListener('click', (e) => {
                if (e.target.closest('button')) return;
                input.click();
            });
            area.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                    input.click();
                }
            });
        }

        function handleFiles(files) {
            if (!files || !files.length) return;
            const file = files[0];
            const ext = file.name.split('.').pop().toLowerCase();
            const sizeMB = (file.size / 1024 / 1024).toFixed(2);

            appendLog(`File: ${file.name} (${sizeMB} MB, ${ext.toUpperCase()})`, 'info');

            // Supersede any conversion still running for the previous file. If one
            // is mid-exec it cannot be interrupted by a message, so restart the
            // worker instead of letting the new file queue behind it.
            if (worker) {
                if (workerBusy) {
                    interruptWorker();
                } else {
                    try { worker.postMessage({ type: 'CANCEL' }); } catch (_) {}
                }
            }

            currentFile = file;
            isExporting = false;
            workerBusy = false;

            const video = document.getElementById('videoPlayer');
            cleanupMediaSource();
            if (pendingExportUrl) { URL.revokeObjectURL(pendingExportUrl); pendingExportUrl = null; }
            if (subtitleTrackUrl) { URL.revokeObjectURL(subtitleTrackUrl); subtitleTrackUrl = null; }
            document.querySelectorAll('#videoPlayer track').forEach(t => t.remove());
            setSubtitleButtonState(false);
            resetAudioTracks();
            setRateControlState(true);
            isFastCopyExport = false;
            if (currentPreviewUrl) { URL.revokeObjectURL(currentPreviewUrl); currentPreviewUrl = null; }
            if (currentVideoUrl) { URL.revokeObjectURL(currentVideoUrl); currentVideoUrl = null; }
            if (convertedVideoUrl) { URL.revokeObjectURL(convertedVideoUrl); convertedVideoUrl = null; }

            // Containers Chrome/Firefox can decode themselves. Everything else
            // (AVI, MKV, WMV, FLV) must wait for the worker: pointing <video> at
            // one of those just paints a broken player with MEDIA_ERR_SRC_NOT_SUPPORTED
            // until the conversion lands.
            const NATIVE_PLAYABLE = new Set(['mp4', 'm4v', 'mov', 'webm', 'ogg', 'ogv']);
            showVideoContainer();
            if (NATIVE_PLAYABLE.has(ext)) {
                const directUrl = URL.createObjectURL(file);
                currentVideoUrl = directUrl;
                video.src = directUrl;
                video.load();
                video.play().catch(() => {});
                showStatus(`Playing ${file.name} — converting in background...`, 'info');
            } else if (ext === 'avi') {
                showStatus(`Connecting live streaming engine for ${file.name}...`, 'info');
            } else {
                showStatus(`Reading ${file.name} — checking for an instant remux...`, 'info');
            }

            if (worker) {
                showProgress();
                workerBusy = true;
                appendLog('Starting FFmpeg conversion pipeline...', 'info');
                try {
                    worker.postMessage({ type: 'PROCESS_VIDEO', file, audioTrack: selectedAudioTrack });
                    worker.postMessage({ type: 'EXTRACT_SUBTITLES', file });
                } catch (e) {
                    workerBusy = false;
                    appendLog('Worker post failed: ' + e.message, 'error');
                    hideProgress();
                }
            } else {
                appendLog('Worker not ready yet — direct playback only', 'warn');
                hideProgress();
            }
        }

        function loadSubtitles(subtitlesData) {
            const video = document.getElementById('videoPlayer');
            document.querySelectorAll('#videoPlayer track').forEach(t => t.remove());
            subtitleTrackUrl = null;

            if (!subtitlesData || !subtitlesData.found || !subtitlesData.vtt) {
                const reason = (subtitlesData && subtitlesData.reason) || 'No subtitle stream in this file';
                appendLog(`No subtitles: ${reason}`, 'info');
                setSubtitleButtonState(false);
                return;
            }

            const track = document.createElement('track');
            track.kind = 'subtitles';
            track.label = 'Extracted subtitles';
            track.srclang = subtitlesData.language || 'en';
            track.default = true;
            subtitleTrackUrl = URL.createObjectURL(new Blob([subtitlesData.vtt], { type: 'text/vtt' }));
            track.src = subtitleTrackUrl;
            video.appendChild(track);
            setSubtitleButtonState(true);
            appendLog('Subtitles extracted and loaded', 'success');
        }

        function setSubtitleButtonState(available) {
            const btn = document.getElementById('subtitleBtn');
            if (!btn) return;
            btn.disabled = !available;
            btn.title = available ? 'Toggle subtitles' : 'This file has no subtitles';
        }

        // The rate control only makes sense once something is loaded, so it follows
        // the same enable/disable rhythm as the subtitle button.
        function setRateControlState(enabled) {
            const sel = document.getElementById('rateSelect');
            if (!sel) return;
            sel.disabled = !enabled;
            sel.title = enabled ? 'Playback speed' : 'Load a video to change playback speed';
            if (!enabled) {
                sel.value = '1';
                const video = document.getElementById('videoPlayer');
                if (video) {
                    video.defaultPlaybackRate = 1;
                    video.playbackRate = 1;
                }
            }
        }

        // Rate is a property of the <video> element, so it survives chunk
        // appends; defaultPlaybackRate is set too because load() (used on every
        // source swap and MediaSource hand-off) resets playbackRate from it.
        window.setPlaybackRate = function (value) {
            const rate = parseFloat(value);
            const video = document.getElementById('videoPlayer');
            if (!video || !Number.isFinite(rate) || rate <= 0) return;
            video.defaultPlaybackRate = rate;
            video.playbackRate = rate;
            appendLog(`Playback speed set to ${rate}×`, 'info');
        };

        // Human label for a probed audio track, e.g. "English (aac, stereo)".
        function describeAudioTrack(track, i) {
            const LANG = {
                eng: 'English', en: 'English', fra: 'French', fre: 'French', fr: 'French',
                deu: 'German', ger: 'German', de: 'German', spa: 'Spanish', es: 'Spanish',
                ita: 'Italian', it: 'Italian', jpn: 'Japanese', ja: 'Japanese',
                kor: 'Korean', ko: 'Korean', zho: 'Chinese', chi: 'Chinese', zh: 'Chinese',
                rus: 'Russian', ru: 'Russian', por: 'Portuguese', pt: 'Portuguese',
                ara: 'Arabic', ar: 'Arabic', hin: 'Hindi', hi: 'Hindi', tha: 'Thai', th: 'Thai',
                vie: 'Vietnamese', vi: 'Vietnamese', nld: 'Dutch', dut: 'Dutch', nl: 'Dutch',
                pol: 'Polish', pl: 'Polish', tur: 'Turkish', tr: 'Turkish',
                swe: 'Swedish', sv: 'Swedish', ukr: 'Ukrainian', uk: 'Ukrainian'
            };
            const bits = [];
            bits.push(track && track.lang ? (LANG[track.lang] || track.lang.toUpperCase()) : `Track ${i + 1}`);
            if (track && track.channels) bits.push(track.channels);
            if (track && track.isDefault) bits.push('default');
            return bits.join(' · ');
        }

        // Only surfaces the picker when a file genuinely has a choice to make, so
        // single-track files keep the toolbar exactly as it was.
        function setAudioTracks(tracks, selected) {
            const sel = document.getElementById('audioTrackSelect');
            if (!sel) return;

            audioTracks = Array.isArray(tracks) ? tracks : [];
            selectedAudioTrack = Number.isInteger(selected) && selected >= 0 ? selected : 0;

            sel.innerHTML = '';
            if (audioTracks.length < 2) {
                sel.style.display = 'none';
                sel.disabled = true;
                return;
            }

            audioTracks.forEach((track, i) => {
                const opt = document.createElement('option');
                opt.value = String(i);
                opt.textContent = describeAudioTrack(track, i);
                if (i === selectedAudioTrack) opt.selected = true;
                sel.appendChild(opt);
            });
            sel.disabled = false;
            sel.style.display = 'inline-flex';
        }

        function resetAudioTracks() {
            audioTracks = [];
            selectedAudioTrack = 0;
            const sel = document.getElementById('audioTrackSelect');
            if (sel) {
                sel.innerHTML = '';
                sel.style.display = 'none';
                sel.disabled = true;
            }
        }

        // Switching tracks re-runs the pipeline from the same source file with a
        // different audio map, which is the only way to change the encoded audio
        // in the streamed/remuxed output.
        window.selectAudioTrack = function (value) {
            const index = parseInt(value, 10);
            if (!currentFile || !worker || !Number.isInteger(index)) return;
            if (index === selectedAudioTrack) return;

            selectedAudioTrack = index;
            appendLog(`Switching to audio track ${index + 1} (${describeAudioTrack(audioTracks[index], index)})`, 'info');
            showStatus(`Switching audio to ${describeAudioTrack(audioTracks[index], index)}...`, 'info');

            cleanupMediaSource();
            if (convertedVideoUrl) {
                try { URL.revokeObjectURL(convertedVideoUrl); } catch (_) {}
                convertedVideoUrl = null;
            }
            isFastCopyExport = false;

            showProgress();
            workerBusy = true;
            try {
                worker.postMessage({ type: 'PROCESS_VIDEO', file: currentFile, audioTrack: index });
            } catch (e) {
                workerBusy = false;
                appendLog('Audio switch failed: ' + e.message, 'error');
                hideProgress();
            }
        };

        // Global controls
        window.toggleSubtitles = function () {
            const tracks = document.getElementById('videoPlayer').textTracks;
            if (tracks.length > 0) {
                const t = tracks[0];
                t.mode = t.mode === 'showing' ? 'hidden' : 'showing';
                showStatus(`Subtitles ${t.mode === 'showing' ? 'enabled' : 'disabled'}`, 'info');
            } else {
                showStatus('No subtitles in this file', 'info');
            }
        };

        function triggerDownload(url) {
            const a = document.createElement('a');
            a.href = url;
            a.download = (currentFile ? currentFile.name.replace(/\.[^.]+$/, '') : 'video') + '.mp4';
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        window.downloadProcessed = function () {
            if (!currentFile) {
                showStatus('Load a video first', 'error');
                return;
            }

            // Streamed playback was assembled from fMP4 chunks, which are not a
            // valid standalone file. Render a real MP4 from the source instead.
            const needsRender = !convertedVideoUrl;
            if (!needsRender && isFastCopyExport) {
                triggerDownload(convertedVideoUrl);
                appendLog('Download started', 'success');
                showStatus('Exporting original-quality MP4', 'success');
                return;
            }

            if (isExporting) {
                showStatus('Export already in progress', 'info');
                return;
            }

            if (!worker) {
                showStatus('FFmpeg still loading — try again in a moment', 'info');
                return;
            }

            isExporting = true;
            appendLog('Rendering MP4 for export...', 'info');
            showProgress();
            document.getElementById('progressText').textContent = 'Preparing MP4 export...';
            worker.postMessage({ type: 'EXPORT_VIDEO', file: currentFile, audioTrack: selectedAudioTrack });
        };

        window.resetPlayer = function () {
            // Interrupt for real if something is encoding right now: a soft
            // CANCEL only makes the job unwind between ffmpeg.run() calls, so a
            // long export would keep the core busy and the next file would queue
            // behind it. Terminating the worker is the only true abort.
            if (worker && workerBusy) {
                interruptWorker();
            } else if (worker) {
                try { worker.postMessage({ type: 'CANCEL' }); } catch (_) {}
            }
            isExporting = false;
            workerBusy = false;
            cleanupMediaSource();

            const video = document.getElementById('videoPlayer');
            video.pause();
            video.removeAttribute('src');
            video.load();

            document.getElementById('videoContainer').style.display = 'none';
            document.getElementById('uploadArea').style.display = 'flex';
            document.getElementById('fileInput').value = '';
            isPlayingPreview = false;
            setSubtitleButtonState(false);
            resetAudioTracks();
            setRateControlState(false);

            if (subtitleTrackUrl) { try { URL.revokeObjectURL(subtitleTrackUrl); } catch (_) {} subtitleTrackUrl = null; }
            if (pendingExportUrl) { try { URL.revokeObjectURL(pendingExportUrl); } catch (_) {} pendingExportUrl = null; }
            if (currentPreviewUrl) { try { URL.revokeObjectURL(currentPreviewUrl); } catch (_) {} currentPreviewUrl = null; }
            if (currentVideoUrl) { try { URL.revokeObjectURL(currentVideoUrl); } catch (_) {} currentVideoUrl = null; }
            if (convertedVideoUrl) { try { URL.revokeObjectURL(convertedVideoUrl); } catch (_) {} convertedVideoUrl = null; }

            currentFile = null;
            isFastCopyExport = false;
            hideProgress();
            showStatus('Player reset', 'info');
        };

        initializeApp();
    </script>
</body>
</html>
