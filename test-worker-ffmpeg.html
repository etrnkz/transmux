<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Worker FFmpeg CDN Test</title>
<style>
body { font-family: Arial; padding: 40px; }
#output { background:#f4f4f4; padding:20px; border-radius:8px; }
.success { color: green; }
.error { color: red; }
.info { color: #333; }
</style>
</head>

<body>

<h1>Worker FFmpeg CDN Test</h1>
<div id="output"></div>

<script>
const output = document.getElementById("output");

function log(msg, type="info") {
    const line = document.createElement("div");
    line.className = type;
    line.textContent = msg;
    output.appendChild(line);
    console.log(msg);
}

log("Starting worker FFmpeg test from CDN...");

try {
    const worker = new Worker("./test-worker-ffmpeg-cdn.js");

    worker.onmessage = (e) => {
        const data = e.data;

        if(data.type === "LOG") log("ℹ️ " + data.message);
        if(data.type === "SUCCESS") log("✅ " + data.message, "success");
        if(data.type === "ERROR") log("❌ " + data.message, "error");
    };

    worker.onerror = (err) => {
        log("❌ Worker error: " + err.message, "error");
    };

    worker.postMessage({ type: "TEST" });

} catch(err) {
    log("❌ Failed to create worker: " + err.message, "error");
}
</script>

</body>
</html>
