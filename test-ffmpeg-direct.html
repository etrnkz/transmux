<!DOCTYPE html>
<html>
<head>
    <title>Direct FFmpeg Test</title>
</head>
<body>
    <h1>Direct FFmpeg Loading Test</h1>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(message) {
            output.innerHTML += message + '<br>';
            console.log(message);
        }
        
        log('Testing direct FFmpeg loading...');
        
        // Test loading the FFmpeg file directly
        const script = document.createElement('script');
        script.src = 'public/ffmpeg.js';
        script.onload = function() {
            log('FFmpeg script loaded');
            log('Available globals:');
            log('- createFFmpeg: ' + typeof createFFmpeg);
            log('- fetchFile: ' + typeof fetchFile);
            log('- FFmpeg: ' + typeof FFmpeg);
            
            if (typeof FFmpeg !== 'undefined') {
                log('FFmpeg object properties: ' + Object.keys(FFmpeg));
                if (FFmpeg.createFFmpeg) {
                    log('✅ FFmpeg.createFFmpeg is available');
                    
                    try {
                        const ffmpeg = FFmpeg.createFFmpeg({ log: true });
                        log('✅ FFmpeg instance created successfully');
                    } catch (error) {
                        log('❌ Failed to create FFmpeg instance: ' + error.message);
                    }
                } else {
                    log('❌ FFmpeg.createFFmpeg not found');
                }
            } else {
                log('❌ FFmpeg global not found');
            }
        };
        
        script.onerror = function(error) {
            log('❌ Failed to load FFmpeg script: ' + error.message);
        };
        
        document.head.appendChild(script);
    </script>
</body>
</html>
